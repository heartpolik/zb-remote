CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Battery build (default): no USB, no console, no logs, start immediately.
# Development build with USB CDC logs: west build ... -- -DEXTRA_CONF_FILE=debug.conf
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=n
CONFIG_APP_WAIT_HOST=n

# own k_sys_fatal_error_handler in main.c (records crash, reboots)
CONFIG_RESET_ON_FATAL_ERROR=n

# Pro Micro clones often have no 32.768 kHz crystal -> use internal RC (calibrated)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Scan all channels when joining (Z2M network is on channel 11)
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Z-Stack 3.x coordinator: classic Zigbee 3.0 (R22) association + transport key
CONFIG_ZIGBEE_PRO_CORE_BEHAVIOR_R22=y

# OLED
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_HWINFO=y
