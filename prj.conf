CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="zb-remote"
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Logs over USB CDC (board default) while bringing up
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Pro Micro clones often have no 32.768 kHz crystal -> use internal RC (calibrated)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Scan all channels when joining (Z2M network is on channel 11)
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Z-Stack 3.x coordinator: classic Zigbee 3.0 (R22) association + transport key
CONFIG_ZIGBEE_PRO_CORE_BEHAVIOR_R22=y

# Legacy USB stack: the new device_next CDC does not enumerate on this Pro Micro clone
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="zb-remote"
CONFIG_USB_DEVICE_PID=0x0004
CONFIG_APP_WAIT_HOST=y

# OLED
CONFIG_I2C=y
CONFIG_DISPLAY=y
