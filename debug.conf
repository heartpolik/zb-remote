# Development overlay: logs over USB CDC ACM (/dev/cu.usbmodem*, 115200).
# west build -d build-debug -b promicro_nrf52840/nrf52840/uf2 . -- -DEXTRA_CONF_FILE=debug.conf
CONFIG_LOG=y
# deferred: logging never blocks the app when the USB host is not reading
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_NCS_BOOT_BANNER=y
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="zb-remote"
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
# Legacy USB stack: the new device_next CDC does not enumerate on this Pro Micro clone
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="zb-remote"
CONFIG_USB_DEVICE_PID=0x0004
# wait up to 20 s for the host to open the port so boot logs are not lost
CONFIG_APP_WAIT_HOST=y
