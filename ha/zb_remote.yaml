# Пакет Home Assistant для пульта zb-remote — https://github.com/heartpolik/zb-remote (ha/zb_remote.yaml).
# Джерело правди — репозиторій; у HA лежить копія в /config/packages/zb_remote.yaml (scripts/deploy-ha.sh).
#
# Прошивка лише шле "кнопка_дія" (zigbee2mqtt/zb_remote/action) й малює те, що пише HA (…/set).
# Кімната: K− (5) / K+ (7) перемикають input_select.pult_room; "Загальний" — огляд дому.
# Екран: title (жовта шапка) = кімната, плитки = світло / яскравість лампи / температура.
#
# Під свій дім змінити:
#   - rooms (anchor &pult_rooms): кімната → main (вкл/вимк), dim (лампа з яскравістю), temp (датчик);
#   - input_select.pult_room.options: "Загальний" + ті самі назви кімнат, що в rooms;
#   - pult_render.triggers: entity_id усіх main/dim (світло оновлюється одразу);
#   - загальний екран (гілка else у pult_render): навантаження / батарея дому / погода;
#   - Z2M friendly_name пристрою має бути `zb_remote` (або замінити топіки).
zb_remote:
  input_select:
    pult_room:
      name: "Пульт: кімната"
      icon: mdi:remote
      options:
        - Загальний
        - Вітальня
        - Кухня
        - Спальня
        - Кабінет
        - Коридор
        - Ванна

  # Цільова яскравість лампи під час серії натискань ☼ / пресетів. Поки timer.pult_dim_hold
  # активний (10 с після натискання), кроки рахуються від неї, а не від стану лампи:
  # хмарні лампи (Tuya/MOMAX) звітують про зміну через 4–8 с, і серія «губилась».
  input_number:
    pult_dim_target:
      name: "Пульт: цільова яскравість"
      icon: mdi:brightness-percent
      min: 0
      max: 100
      step: 1
      unit_of_measurement: "%"
      mode: box

  timer:
    pult_dim_hold:
      name: "Пульт: серія яскравості"
      duration: "00:00:10"

  script:
    pult_dim_apply:
      alias: "Пульт: застосувати яскравість"
      description: >-
        Шле на лампу лише фінальне значення серії: кожен виклик перезапускає скрипт,
        лампа отримує команду через 0.3 с після останнього натискання.
      mode: restart
      fields:
        entity: {description: "Лампа"}
        pct: {description: "Яскравість 0–100, 0 = вимкнути"}
      sequence:
        - delay: 0.3
        - if: "{{ pct | int > 0 }}"
          then:
            # MOMAX (Tuya cloud) ігнорує turn_on з яскравістю, коли вимкнена: спершу просто ввімкнути
            - if: "{{ not is_state(entity, 'on') }}"
              then:
                - action: light.turn_on
                  target: {entity_id: "{{ entity }}"}
                - wait_template: "{{ is_state(entity, 'on') }}"
                  timeout: 5
            - action: light.turn_on
              target: {entity_id: "{{ entity }}"}
              data: {brightness_pct: "{{ pct | int }}"}
          else:
            - action: light.turn_off
              target: {entity_id: "{{ entity }}"}

  automation:
    - id: pult_room_nav
      alias: "Пульт: кімната ◀ ▶"
      description: K− (5) — попередня кімната, K+ (7) — наступна (по колу).
      mode: queued
      triggers:
        - trigger: mqtt
          topic: zigbee2mqtt/zb_remote/action
          payload: 5_single
          id: prev
        - trigger: mqtt
          topic: zigbee2mqtt/zb_remote/action
          payload: 7_single
          id: next
      actions:
        - action: timer.cancel
          target: {entity_id: timer.pult_dim_hold}
        - if: "{{ trigger.id == 'prev' }}"
          then:
            - action: input_select.select_previous
              target: {entity_id: input_select.pult_room}
              data: {cycle: true}
          else:
            - action: input_select.select_next
              target: {entity_id: input_select.pult_room}
              data: {cycle: true}

    - id: pult_light_buttons
      alias: "Пульт: світло в обраній кімнаті"
      description: >-
        ⏻ (1) — основне світло вкл/вимк, утримання — вимкнути все світло з пульта.
        ☼ (4/8) — яскравість лампи ±10 % (утримання ±30 %), 20/50/100 % (9/10/11).
      mode: queued
      triggers:
        - trigger: mqtt
          topic: zigbee2mqtt/zb_remote/action
      variables: &pult_rooms
        rooms:
          Вітальня: {main: light.light_diningroom_l2, dim: light.wled, temp: sensor.sensor_dining_temperature}
          Кухня: {main: light.light_diningroom_l1, temp: sensor.sensor_kitchen_temperature}
          Спальня: {main: light.light_bedroom_l1, dim: light.spalnia_wled, temp: sensor.nous_e6_temperature}
          Кабінет: {main: light.light_bedroom_l2, dim: light.momax_smart_bright_lamp_wifi_bt_ql6s, temp: sensor.esphome_web_9480c0_mhi_ac_return_air_temperature}
          Коридор: {main: light.light_corridor_l1}
          Ванна: {main: light.light_bath_l2, dim: light.big_lamp_4, temp: sensor.sensor_bath_temperature}
      actions:
        - variables:
            act: "{{ trigger.payload }}"
            cfg: "{{ rooms.get(states('input_select.pult_room'), {}) }}"
            all_lights: >-
              {% set ns = namespace(l=[]) %}
              {% for r in rooms.values() %}{% set ns.l = ns.l + [r.main] + ([r.dim] if r.dim is defined else []) %}{% endfor %}
              {{ ns.l }}
            step: "{{ {'4_single': 10, '8_single': -10, '4_hold': 30, '8_hold': -30}.get(act, 0) }}"
            preset: "{{ {'9_single': 20, '10_single': 50, '11_single': 100}.get(act, 0) }}"
        - choose:
            # ⏻: основне світло (локальне, швидке) — плитка одразу, потім toggle
            - conditions: "{{ act == '1_single' and cfg.main is defined }}"
              sequence:
                - action: mqtt.publish
                  data:
                    topic: zigbee2mqtt/zb_remote/set
                    payload: "{{ {'tile1': 'bulb_off|OFF' if is_state(cfg.main, 'on') else 'bulb|ON'} | to_json }}"
                - action: light.toggle
                  target: {entity_id: "{{ cfg.main }}"}
            - conditions: "{{ act == '1_hold' }}"
              sequence:
                - action: timer.cancel
                  target: {entity_id: timer.pult_dim_hold}
                - action: light.turn_off
                  target: {entity_id: "{{ all_lights }}"}
            # ☼ / пресети: рахуємо від цільового значення серії, плитка одразу, лампа — у скрипті
            - conditions: "{{ (step != 0 or preset > 0) and cfg.dim is defined }}"
              sequence:
                - variables:
                    cur: >-
                      {% if is_state('timer.pult_dim_hold', 'active') %}{{ states('input_number.pult_dim_target') | int(0) }}
                      {% elif is_state(cfg.dim, 'on') %}{{ ((state_attr(cfg.dim, 'brightness') | int(0)) * 100 / 255) | round(0) | int }}
                      {% else %}0{% endif %}
                    new: "{{ preset if preset > 0 else [[cur | int + step, 0] | max, 100] | min }}"
                - action: input_number.set_value
                  target: {entity_id: input_number.pult_dim_target}
                  data: {value: "{{ new }}"}
                - action: timer.start
                  target: {entity_id: timer.pult_dim_hold}
                - action: mqtt.publish
                  data:
                    topic: zigbee2mqtt/zb_remote/set
                    payload: "{{ {'tile2': 'sun|' ~ new ~ '%' if new | int > 0 else 'sun|OFF'} | to_json }}"
                - action: script.turn_on
                  target: {entity_id: script.pult_dim_apply}
                  data:
                    variables: {entity: "{{ cfg.dim }}", pct: "{{ new }}"}

    - id: pult_render
      alias: "Пульт: екран"
      description: >-
        Пише на пульт шапку й плитки. Загальний: навантаження / батарея дому / надворі.
        Кімната: світло / яскравість лампи / температура. Світло — одразу, решта — раз на 5 хв.
        Під час серії ☼ (timer.pult_dim_hold) яскравість = цільова, а не запізнілий стан лампи.
      mode: restart
      triggers:
        - trigger: state
          entity_id: input_select.pult_room
        - trigger: state
          entity_id:
            - light.light_diningroom_l2
            - light.wled
            - light.light_diningroom_l1
            - light.light_bedroom_l1
            - light.spalnia_wled
            - light.light_bedroom_l2
            - light.momax_smart_bright_lamp_wifi_bt_ql6s
            - light.light_corridor_l1
            - light.light_bath_l2
            - light.big_lamp_4
        - trigger: event
          event_type: timer.finished
          event_data: {entity_id: timer.pult_dim_hold}
        - trigger: time_pattern
          minutes: /5
        - trigger: homeassistant
          event: start
      variables: *pult_rooms
      actions:
        - delay: 0.15  # склеїти пачку тригерів; більше не треба — пульт опитує батька раз на 100 мс протягом 10 с
        - variables:
            room: "{{ states('input_select.pult_room') }}"
            payload: >-
              {% set num = '%.1f' %}
              {% if room in rooms %}
                {% set c = rooms[room] %}
                {% set m = states(c.main) %}
                {% set t1 = ('bulb|ON' if m == 'on' else 'bulb_off|OFF' if m == 'off' else 'bulb_off|?') %}
                {% if c.dim is defined %}
                  {% set d = states(c.dim) %}
                  {% if is_state('timer.pult_dim_hold', 'active') %}
                    {% set tg = states('input_number.pult_dim_target') | int(0) %}
                    {% set t2 = 'sun|' ~ tg ~ '%' if tg > 0 else 'sun|OFF' %}
                  {% else %}
                    {% set t2 = 'sun|' ~ ((state_attr(c.dim, 'brightness') | int(0) * 100 / 255) | round(0) | int) ~ '%' if d == 'on' else 'sun|OFF' if d == 'off' else 'sun|?' %}
                  {% endif %}
                {% else %}{% set t2 = 'sun|—' %}{% endif %}
                {% set tv = states(c.temp) if c.temp is defined else 'unknown' %}
                {% set t3 = 'temp|' ~ (num | format(tv | float)) ~ '°' if is_number(tv) else 'temp|—' %}
                {{ {'title': room, 'tile1': t1, 'tile2': t2, 'tile3': t3} | to_json }}
              {% else %}
                {% set load = states('sensor.must_p_load') %}
                {% set soc = states('sensor.felicity_soc') %}
                {% set out = state_attr('weather.forecast_golovna', 'temperature') %}
                {% set t1 = 'power|' ~ (((load | float / 1000) | round(1)) ~ 'kW' if is_number(load) and load | float >= 1000 else (load | int ~ 'W') if is_number(load) else '—') %}
                {% set t2 = 'battery|' ~ (soc | int ~ '%' if is_number(soc) else '—') %}
                {% set t3 = 'temp|' ~ ((num | format(out | float)) ~ '°' if is_number(out) else '—') %}
                {{ {'title': '', 'tile1': t1, 'tile2': t2, 'tile3': t3} | to_json }}
              {% endif %}
        - action: mqtt.publish
          data:
            topic: zigbee2mqtt/zb_remote/set
            payload: "{{ payload | to_json }}"

    - id: pult_room_timeout
      alias: "Пульт: повернення на загальний екран"
      description: Через 2 хв без натискань пульт повертається на «Загальний».
      mode: restart
      triggers:
        - trigger: mqtt
          topic: zigbee2mqtt/zb_remote/action
        - trigger: state
          entity_id: input_select.pult_room
      conditions:
        - condition: template
          value_template: "{{ states('input_select.pult_room') != 'Загальний' }}"
      actions:
        - delay: "00:02:00"
        - action: input_select.select_option
          target: {entity_id: input_select.pult_room}
          data: {option: Загальний}
